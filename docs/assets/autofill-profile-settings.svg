<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="963" viewBox="0 0 1440 963" role="img" aria-label="Amex Autofill profile settings screen UX reference"><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}</style></defs><rect x="0" y="0" width="1440" height="963" rx="0" fill="#F5F8FE" stroke="none" stroke-width="1"/><text x="42" y="56" font-size="32" fill="#102750" font-weight="750" text-anchor="start">Amex Autofill｜プロフィール設定画面</text><text x="42" y="88" font-size="17" fill="#596F89" font-weight="400" text-anchor="start">初回登録・編集専用の拡張タブ。項目名は日本語＋US Amex英語表記。</text><rect x="32" y="115" width="1376" height="801" rx="16" fill="#FFFFFF" stroke="#D6E0EE" stroke-width="1"/><rect x="33" y="116" width="1374" height="46" rx="14" fill="#F1F4F8" stroke="none" stroke-width="1"/><circle cx="56" cy="139" r="6" fill="#F26962"/><circle cx="76" cy="139" r="6" fill="#E5B344"/><circle cx="96" cy="139" r="6" fill="#56B86B"/><rect x="260" y="124" width="840" height="30" rx="9" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/><text x="680" y="144" font-size="12" fill="#8190A4" font-weight="400" text-anchor="middle">chrome-extension://…/options.html</text><rect x="33" y="162" width="231" height="753" rx="0" fill="#F8FAFD" stroke="none" stroke-width="1"/><line x1="264" y1="163" x2="264" y2="914" stroke="#DDE6F1"/><rect x="56" y="186" width="38" height="38" rx="8" fill="#1565E8" stroke="none" stroke-width="1"/><text x="75" y="211" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">AX</text><text x="105" y="201" font-size="17" fill="#14315A" font-weight="700" text-anchor="start">Amex Autofill</text><text x="105" y="221" font-size="12" fill="#7D8C9F" font-weight="400" text-anchor="start">Business Platinum</text><rect x="46" y="266" width="204" height="44" rx="9" fill="#E7F0FF" stroke="none" stroke-width="1"/><text x="65" y="292" font-size="21" fill="#1761DB" font-weight="700" text-anchor="start">▣</text><text x="99" y="292" font-size="15" fill="#1358CA" font-weight="700" text-anchor="start">プロフィール設定</text><text x="65" y="342" font-size="21" fill="#69819D" font-weight="700" text-anchor="start">♙</text><text x="99" y="342" font-size="15" fill="#38546D" font-weight="500" text-anchor="start">セキュリティ</text><text x="65" y="392" font-size="21" fill="#69819D" font-weight="700" text-anchor="start">▤</text><text x="99" y="392" font-size="15" fill="#38546D" font-weight="500" text-anchor="start">データ管理</text><text x="65" y="472" font-size="21" fill="#69819D" font-weight="700" text-anchor="start">ⓘ</text><text x="99" y="472" font-size="15" fill="#38546D" font-weight="500" text-anchor="start">使い方</text><text x="294" y="212" font-size="25" fill="#142B50" font-weight="700" text-anchor="start">プロフィール設定</text><text x="294" y="240" font-size="14" fill="#617892" font-weight="400" text-anchor="start">US Amex Business Platinum 申込用の登録情報を管理します。</text><rect x="1167" y="192" width="180" height="42" rx="21" fill="#E9F8F0" stroke="none" stroke-width="1"/><text x="1185" y="218" font-size="14" fill="#17764F" font-weight="700" text-anchor="start">✓  暗号化して保存</text><rect x="294" y="270" width="178" height="49" rx="9" fill="#EAF2FF" stroke="#AFCBFA" stroke-width="1"/><text x="383" y="301" font-size="15" fill="#1659CB" font-weight="700" text-anchor="middle">事業情報</text><rect x="485" y="270" width="178" height="49" rx="9" fill="#F3F6FB" stroke="#E2EAF4" stroke-width="1"/><text x="574" y="301" font-size="15" fill="#556F8A" font-weight="500" text-anchor="middle">個人情報</text><rect x="676" y="270" width="190" height="49" rx="9" fill="#F3F6FB" stroke="#E2EAF4" stroke-width="1"/><text x="771" y="301" font-size="15" fill="#556F8A" font-weight="500" text-anchor="middle">カード設定</text><rect x="879" y="270" width="193" height="49" rx="9" fill="#F3F6FB" stroke="#E2EAF4" stroke-width="1"/><text x="975.5" y="301" font-size="15" fill="#556F8A" font-weight="500" text-anchor="middle">セキュリティ</text><rect x="294" y="340" width="1052" height="482" rx="12" fill="#FFFFFF" stroke="#DBE5F1" stroke-width="1"/><text x="319" y="380" font-size="20" fill="#142D50" font-weight="700" text-anchor="start">事業情報 / Business Information</text><text x="319" y="405" font-size="12" fill="#6B7F98" font-weight="400" text-anchor="start">赤い * は必須項目。入力は暗号化してこの端末に保存します。</text><text x="320" y="433" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">メールアドレス *</text><text x="320" y="450" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Email Address</text><rect x="320" y="460" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="334" y="487" font-size="14" fill="#718198" font-weight="400" text-anchor="start">example@company.com</text><text x="814" y="433" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">事業形態 *</text><text x="814" y="450" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Company Structure</text><rect x="814" y="460" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="828" y="487" font-size="14" fill="#718198" font-weight="400" text-anchor="start">Corporation</text><text x="1235" y="487" font-size="18" fill="#7E8DA1" font-weight="600" text-anchor="middle">⌄</text><text x="320" y="525" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">正式な事業名 *</text><text x="320" y="542" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Legal Business Name</text><rect x="320" y="552" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="334" y="579" font-size="14" fill="#718198" font-weight="400" text-anchor="start">Example Inc.</text><text x="814" y="525" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">業種 *</text><text x="814" y="542" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Industry Type</text><rect x="814" y="552" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="828" y="579" font-size="14" fill="#718198" font-weight="400" text-anchor="start">Retail Trade</text><text x="1235" y="579" font-size="18" fill="#7E8DA1" font-weight="600" text-anchor="middle">⌄</text><text x="320" y="617" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">カードに表示する事業名 *</text><text x="320" y="634" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Business Name on Card</text><rect x="320" y="644" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="334" y="671" font-size="14" fill="#718198" font-weight="400" text-anchor="start">Example Inc.</text><text x="814" y="617" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">営業年数 *</text><text x="814" y="634" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Years in Business</text><rect x="814" y="644" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="828" y="671" font-size="14" fill="#718198" font-weight="400" text-anchor="start">3-5 years</text><text x="1235" y="671" font-size="18" fill="#7E8DA1" font-weight="600" text-anchor="middle">⌄</text><text x="320" y="709" font-size="14" fill="#334B65" font-weight="650" text-anchor="start">DBA（屋号）</text><text x="320" y="726" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Company DBA Name</text><rect x="320" y="736" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="334" y="763" font-size="14" fill="#718198" font-weight="400" text-anchor="start">Example Co.</text><text x="814" y="709" font-size="14" fill="#213D5C" font-weight="650" text-anchor="start">従業員数 *</text><text x="814" y="726" font-size="11.5" fill="#8191A6" font-weight="400" text-anchor="start">Number of Employees</text><rect x="814" y="736" width="445" height="43" rx="8" fill="#FAFCFF" stroke="#C8D7E8" stroke-width="1"/><text x="828" y="763" font-size="14" fill="#718198" font-weight="400" text-anchor="start">1</text><rect x="321" y="803" width="17" height="17" rx="4" fill="#FFFFFF" stroke="#BFCDE0" stroke-width="1"/><text x="348" y="817" font-size="12.5" fill="#56708D" font-weight="400" text-anchor="start">DBA（屋号）はない / Company does not have a DBA</text><line x1="294" y1="841" x2="1345" y2="841" stroke="#E5EBF4"/><text x="324" y="878" font-size="12" fill="#7A8CA2" font-weight="400" text-anchor="start">* 表示内容はUIサンプル。実際の項目・選択肢は検証済みフォーム定義に従います。</text><rect x="1142" y="852" width="204" height="46" rx="9" fill="#1463E5" stroke="none" stroke-width="1"/><text x="1244" y="881" font-size="15" fill="white" font-weight="700" text-anchor="middle">暗号化して保存</text><text x="43" y="943" font-size="13" fill="#607791" font-weight="400" text-anchor="start">※ セキュリティタブでマスターパスワード設定必須。通常のPopupには登録フォームを表示しません。</text></svg>