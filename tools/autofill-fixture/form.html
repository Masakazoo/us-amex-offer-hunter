<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Autofill local fixture</title>
    <style>
      body {
        font: 16px/1.5 system-ui;
        max-width: 650px;
        margin: 40px auto;
        padding: 20px;
      }
      label {
        display: block;
        margin-top: 12px;
      }
      input {
        display: block;
        padding: 8px;
        width: 90%;
      }
      fieldset {
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <h1>Autofill 模擬フォーム</h1>
    <p>送信機能なし。テスト用の意味を持たない文字列だけを入力してください。</p>
    <form autocomplete="off">
      <label for="email">Email Address *</label
      ><input id="email" name="email" type="text" maxlength="50" />
      <label for="legalBusinessName">Legal Business Name *</label
      ><input
        id="legalBusinessName"
        name="legalBusinessName"
        type="text"
        maxlength="90"
      />
      <label for="businessNameOnCard">Business Name on Card *</label
      ><input
        id="businessNameOnCard"
        name="businessNameOnCard"
        type="text"
        maxlength="20"
      />
      <label for="companyDBAName">Company DBA Name *</label
      ><input
        id="companyDBAName"
        name="companyDBAName"
        type="text"
        maxlength="90"
      />
      <label for="firstName">First Name *</label
      ><input id="firstName" name="firstName" type="text" maxlength="15" />
      <label for="lastName">Last Name *</label
      ><input id="lastName" name="lastName" type="text" maxlength="20" />
      <label for="nameOnCard">Name on Card *</label
      ><input id="nameOnCard" name="nameOnCard" type="text" maxlength="20" />
      <fieldset>
        <legend>対象外の項目</legend>
        <label for="ssn">Social Security Number</label
        ><input id="ssn" name="ssn" type="password" /><label for="dateOfBirth"
          >Date Of Birth (MM-DD-YYYY)</label
        ><input id="dateOfBirth" name="dateOfBirth" type="text" />
      </fieldset>
    </form>
  </body>
</html>
