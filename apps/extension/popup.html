<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autofill — Local MVP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Autofill <small>Local MVP</small></h1>
    <p>
      ローカル模擬フォーム専用。テストには意味を持たない文字列を使用してください。
    </p>
    <section aria-label="暗号化ファイルからの読み込み">
      <label
        >解除済み保管庫の profile.yaml を選択
        <input type="file" id="vault-file" accept=".yaml,.yml" />
      </label>
      <button type="button" id="lock" disabled>メモリの本人情報を削除</button>
      <p class="note">
        読み込みはメモリ内のみ。ブラウザ終了・拡張再読み込みで消えます。
        読み込み後は保管庫を取り出してください。DBAなしは空文字のままにします。
        本人情報の正しさ・申込資格の検証ではありません。この版では読み込んだ情報をフォームへ入力しません。
      </p>
    </section>
    <form id="profile" autocomplete="off"></form>
    <div class="buttons">
      <button type="button" id="save">端末に保存</button
      ><button type="button" id="delete">保存情報を全削除</button>
    </div>
    <p class="note">
      保存はこの端末の拡張ストレージ（暗号化なし）。同期・ログ出力は行いません。
    </p>
    <div class="buttons">
      <button type="button" id="inspect">フォームを検出</button
      ><button type="button" id="fill" disabled>Fill Now</button>
    </div>
    <p id="message" role="status" aria-live="polite">
      入力内容を保存して、模擬フォームを検出してください。
    </p>
    <ul id="results" aria-label="項目ごとの結果"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
